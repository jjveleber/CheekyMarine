name: chartpack-ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TIPPECANOE_TAG: "2.79.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal g++ make zlib1g-dev libsqlite3-dev

      - name: Cache tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/tippecanoe
            ~/.local/bin/tile-join
          key: tippecanoe-${{ env.TIPPECANOE_TAG }}-ubuntu-24.04

      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: chartpack/scripts/install-tippecanoe.sh

      - name: Create venv and install
        working-directory: chartpack
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Run tests
        working-directory: chartpack
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/pytest -q

      # The datum check against NOAA VDatum needs the PROJ geoid grids (about 97 MB) from cdn.proj.org, kept in
      # chartpack/cache/proj between runs. The key names each grid and its sha256 (chartpack.datum.geoid.GRIDS);
      # change it with GRIDS. A stale or damaged restore is caught by the sha256 check and fetched again.
      - name: Cache the geoid grids
        uses: actions/cache@v4
        with:
          path: chartpack/cache/proj
          key: proj-grids-us_nga_egm08_25-4191d471eefebf24-us_noaa_g2018u0-fa9a407ac7ee3f5a

      # Only the datum online tests run here; the other online tests stay off in CI.
      - name: Run datum online tests
        working-directory: chartpack
        env:
          CHARTPACK_ONLINE: "1"
        run: .venv/bin/pytest -q -m online tests/test_datum_geoid.py

      # CI-only tool (ISC licence), not shipped. Checks the generated styles against the MapLibre style
      # spec, which the unit tests do not do. The 26.4.4 release is pinned exactly.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate generated styles against the MapLibre style spec
        working-directory: chartpack
        run: |
          mkdir -p work/ci-styles
          .venv/bin/python -c "
          import json
          from chartpack.style.fish import fish_style
          from chartpack.style.nav import nav_style
          from chartpack.style.palette import PALETTES
          for p in PALETTES:
              for name, fn in (('nav', nav_style), ('fish', fish_style)):
                  json.dump(fn(p), open(f'work/ci-styles/{name}-{p}.json', 'w'))
          "
          npx --yes -p @maplibre/maplibre-gl-style-spec@26.4.4 gl-style-validate work/ci-styles/*.json
