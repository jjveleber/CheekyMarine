name: CI

# Also called by release.yml, so a release always runs the tests (including the
# vcan guard) and builds the tarballs it publishes.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Set up vcan0
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Require vcan test to run (not skip)
        run: |
          ./build/n2kd/n2kd_tests "[vcan]" --reporter junit --out vcan.xml
          if grep -q '<skipped' vcan.xml; then echo "vcan test skipped"; exit 1; fi
          if grep -q 'tests="0"' vcan.xml; then echo "vcan test did not run"; exit 1; fi

  release-build:
    uses: ./.github/workflows/build-release.yml
