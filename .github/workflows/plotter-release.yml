name: plotter-release

# Tag plotter-vX.Y.Z (must equal PLOTTER_VERSION in plotter/CMakeLists.txt) builds, bundles and publishes
# the plotter. Pull requests that touch the bundle run the same test and bundle jobs and upload the
# artifact, but never publish.
on:
  push:
    tags: ['plotter-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - "plotter/**"
      - "scripts/bundle-plotter.sh"
      - "scripts/tests/test_bundle_plotter.sh"
      - "scripts/check-plotter-tag.sh"
      - ".github/workflows/plotter-release.yml"
      - ".github/workflows/plotter-ci.yml"

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  version:
    if: startsWith(github.ref, 'refs/tags/plotter-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches PLOTTER_VERSION
        run: scripts/check-plotter-tag.sh "${GITHUB_REF_NAME}"

  test:
    uses: ./.github/workflows/plotter-ci.yml

  bundle:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libicu-dev \
            libcurl4-openssl-dev libuv1-dev libsqlite3-dev zlib1g-dev libpng-dev libjpeg-dev libwebp-dev \
            libxcb-cursor0

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-6.8.3-linux_gcc_64

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pipx install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O ~/Qt

      - name: Cache maplibre-native-qt
        id: maplibre-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/maplibre-qt
          key: maplibre-qt-${{ hashFiles('scripts/build-maplibre-qt.sh') }}-qt${{ env.QT_VERSION }}-ubuntu-24.04

      - name: Build maplibre-native-qt
        if: steps.maplibre-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          CMAKE_PREFIX_PATH="$HOME/Qt/$QT_VERSION/gcc_64" scripts/build-maplibre-qt.sh "$HOME/.local/maplibre-qt"

      - name: Configure
        run: |
          cmake -S . -B build-plotter -G Ninja -DCM_BUILD_PLOTTER=ON -DN2K_BUILD_TESTS=OFF \
            -DCM_PLOTTER_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/$QT_VERSION/gcc_64;$HOME/.local/maplibre-qt"

      - name: Build
        run: cmake --build build-plotter

      - name: Bundle
        run: |
          version="$(sed -n -E 's/^set\(PLOTTER_VERSION ([0-9]+\.[0-9]+\.[0-9]+)\).*$/\1/p' plotter/CMakeLists.txt | head -n1)"
          scripts/bundle-plotter.sh build-plotter "$HOME/Qt/$QT_VERSION/gcc_64" "$HOME/.local/maplibre-qt" "$version"
          sha256sum cheekyplotter-*-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Test the bundle
        run: scripts/tests/test_bundle_plotter.sh cheekyplotter-*-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: plotter-release
          path: |
            cheekyplotter-*-x86_64.tar.gz
            SHA256SUMS

  publish:
    needs: [version, bundle]
    if: startsWith(github.ref, 'refs/tags/plotter-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plotter-release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cheekyplotter-*-x86_64.tar.gz
            SHA256SUMS
          make_latest: false
          generate_release_notes: true
