name: chartpack-release

# Builds, checks and publishes one pack per tag: charts-<region>-vX.Y.Z or bathy-<region>-vX.Y.Z.
# The tag must equal the pack's version in chartpack/regions/<region>.toml (scripts/check-pack-tag.sh).
#
# No local builds: every pack builds here, on ubuntu-24.04, through chartpack/scripts/fit-guard.sh
# (max RSS 12 GiB, free disk 2 GiB, 5 h). A pack that does not fit is split on the ownership grid.
#
# Dry run: start this workflow by hand (workflow_dispatch) with a pack and a region. It builds,
# checks and archives like a tag run, then uploads the archive, SHA256SUMS and build-stats.json as
# a workflow artifact. It skips the tag check and never publishes.
#
# Canadian source data (NONNA, the BC coastline and what is derived from them) comes only from the
# assets of the release sources-bc-1, which chartpack-sources.yml writes: no step here calls a
# Canadian host (plan 8 spec 5).

on:
  push:
    tags: ['charts-*', 'bathy-*']
  workflow_dispatch:
    inputs:
      pack:
        description: Pack kind
        type: choice
        options: [charts, bathy]
        required: true
      region:
        description: Region file name without .toml
        type: string
        required: true

permissions:
  contents: read

env:
  TIPPECANOE_TAG: "2.79.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      pack: ${{ steps.tag.outputs.pack }}
      region: ${{ steps.tag.outputs.region }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the region file
        id: tag
        env:
          INPUT_PACK: ${{ inputs.pack }}
          INPUT_REGION: ${{ inputs.region }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Dry run: no tag, so take the version from the region file.
            if [[ ! "${INPUT_REGION}" =~ ^[a-z0-9-]+$ ]]; then
              echo "region input must match [a-z0-9-]+" >&2
              exit 1
            fi
            if [[ ! "${INPUT_PACK}" =~ ^(charts|bathy)$ ]]; then
              echo "pack input must be charts or bathy" >&2
              exit 1
            fi
            file="chartpack/regions/${INPUT_REGION}.toml"
            ver="$(sed -n -E "s/^[[:space:]]*${INPUT_PACK}_version[[:space:]]*=[[:space:]]*\"([0-9]+\.[0-9]+\.[0-9]+)\".*$/\1/p" "$file" | head -n1)"
            if [ -z "$ver" ]; then
              echo "no ${INPUT_PACK}_version in $file" >&2
              exit 1
            fi
            line="PACK=${INPUT_PACK} REGION=${INPUT_REGION} VERSION=${ver}"
          else
            line="$(chartpack/scripts/check-pack-tag.sh "${GITHUB_REF_NAME}")"
          fi
          echo "$line"
          # "PACK=charts REGION=x VERSION=1.0.0" becomes the outputs pack, region and version.
          echo "$line" | tr ' ' '\n' | sed -E 's/^PACK=/pack=/; s/^REGION=/region=/; s/^VERSION=/version=/' >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    env:
      CM_WORK: ${{ github.workspace }}/chartpack/work
      PACK: ${{ needs.version.outputs.pack }}
      REGION: ${{ needs.version.outputs.region }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal g++ make zlib1g-dev libsqlite3-dev time

      - name: Cache tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/tippecanoe
            ~/.local/bin/tile-join
          key: tippecanoe-${{ env.TIPPECANOE_TAG }}-ubuntu-24.04

      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: chartpack/scripts/install-tippecanoe.sh

      - name: Create venv and install
        working-directory: chartpack
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e .

      - name: Download the source assets from the release sources-bc-1
        working-directory: chartpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A region with NONNA among its sources gets its own assets: the fetch and derive stats, the NONNA grids,
          # the land and the no-survey mask (the builds check each against the sha256 in the stats). The overview
          # gets every region's NONNA-100 grid, land, no-survey mask and stats, and never a NONNA-10 grid.
          read -r nonna overview name < <(.venv/bin/python -c 'import sys, tomllib; d = tomllib.load(open(sys.argv[1], "rb")); print(int(bool({"nonna10", "nonna100"} & set(d["bathy"]["sources"]))), int(d.get("overview", False)), d.get("sources", {}).get("assets", d["name"]))' "regions/${REGION}.toml")
          echo "NONNA=${nonna}" >> "$GITHUB_ENV"
          if [ "${nonna}" = 0 ]; then
            echo "regions/${REGION}.toml lists no NONNA: no source assets needed"
            exit 0
          fi
          if [[ ! "${name}" =~ ^[a-z0-9-]+$ ]]; then
            echo "[sources] assets must match [a-z0-9-]+" >&2
            exit 1
          fi
          if ! assets="$(scripts/release-assets.sh sources-bc-1)"; then
            echo "cannot list release sources-bc-1: run chartpack-sources.yml" >&2
            exit 1
          fi
          if [ "${overview}" = 1 ]; then
            wanted="$(grep -E '^(nonna100-.+\.tif|(land|nosurvey)-.+\.geojson\.gz|(fetch|derive)-stats-.+\.json)$' <<< "${assets}" || true)"
          else
            wanted="$(grep -Fx -e "fetch-stats-${name}.json" -e "derive-stats-${name}.json" -e "nonna10-${name}.tif" \
                      -e "nonna100-${name}.tif" -e "land-${name}.geojson.gz" -e "nosurvey-${name}.geojson.gz" \
                      <<< "${assets}" || true)"
          fi
          if [ -z "${wanted}" ]; then
            echo "no assets for ${REGION} in sources-bc-1: run chartpack-sources.yml stages fetch and derive first" >&2
            exit 1
          fi
          patterns=()
          while read -r f; do
            patterns+=(-p "$f")
          done <<< "${wanted}"
          mkdir -p cache/sources-bc-1
          gh release download sources-bc-1 "${patterns[@]}" -D cache/sources-bc-1 --clobber
          ls -l cache/sources-bc-1

      - name: Fetch and build the charts pack
        if: env.PACK == 'charts'
        working-directory: chartpack
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/chartpack fetch-enc "regions/${REGION}.toml" --cache cache
          .venv/bin/chartpack fetch-seabed "regions/${REGION}.toml" --cache cache
          if [ "${NONNA}" = 1 ]; then
            # Derived charts read the depth sources (NONNA from the cache, CRM, ETOPO) and the geoid grids.
            .venv/bin/chartpack fetch-bathy "regions/${REGION}.toml" --cache cache
          fi
          mkdir -p work
          scripts/fit-guard.sh "${GITHUB_WORKSPACE}/build-stats.json" -- \
            .venv/bin/chartpack build-enc "regions/${REGION}.toml" work/charts --cache cache --work work/enc

      - name: Fetch and build the bathy pack
        if: env.PACK == 'bathy'
        working-directory: chartpack
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/chartpack fetch-enc "regions/${REGION}.toml" --cache cache
          .venv/bin/chartpack fetch-bathy "regions/${REGION}.toml" --cache cache
          mkdir -p work
          scripts/fit-guard.sh "${GITHUB_WORKSPACE}/build-stats.json" -- \
            .venv/bin/chartpack build-bathy "regions/${REGION}.toml" work/bathy --cache cache --work work/bathy-tmp

      - name: Check the pack
        id: check
        working-directory: chartpack
        run: |
          .venv/bin/chartpack check "work/${PACK}/${PACK}-${REGION}-${VERSION}" --enc-cache cache

      # A dry run whose check fails keeps the built tiles for a look; a tag run never does.
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'workflow_dispatch' && steps.check.outcome == 'failure'
        with:
          name: failed-pack
          path: chartpack/work/${{ env.PACK }}/${{ env.PACK }}-${{ env.REGION }}-${{ env.VERSION }}/*.mbtiles
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn

      - name: Archive the pack
        working-directory: chartpack
        run: |
          .venv/bin/chartpack archive "work/${PACK}/${PACK}-${REGION}-${VERSION}" dist
          cp "${GITHUB_WORKSPACE}/build-stats.json" dist/

      - name: Write the release notes
        working-directory: chartpack
        run: |
          # The pack's cheekymarine:data_notice (the CHS notice and the other credits, plan 8 spec 11), when it
          # has one; an empty file otherwise.
          file=enc.mbtiles
          if [ "${PACK}" = bathy ]; then
            file=bathy.mbtiles
          fi
          .venv/bin/python -c 'import sqlite3, sys; row = sqlite3.connect(sys.argv[1]).execute("select value from metadata where name = ?", ("cheekymarine:data_notice",)).fetchone(); print(row[0] if row else "", end="")' "work/${PACK}/${PACK}-${REGION}-${VERSION}/${file}" > dist/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: pack
          path: |
            chartpack/dist/${{ needs.version.outputs.pack }}-${{ needs.version.outputs.region }}-${{ needs.version.outputs.version }}.tar
            chartpack/dist/SHA256SUMS
            chartpack/dist/build-stats.json
            chartpack/dist/release-notes.md
          if-no-files-found: error

      # The guard writes build-stats.json even when it fails the build, so keep it for a dry run over the limits.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-stats
          path: build-stats.json
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar
            SHA256SUMS
            build-stats.json
          body_path: release-notes.md  # the pack's data notice, before the generated notes
          generate_release_notes: true
          # "Latest" stays with the n2kd v* releases; a pack release never replaces it.
          make_latest: false
