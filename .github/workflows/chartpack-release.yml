name: chartpack-release

# Builds, checks and publishes one pack per tag: charts-<region>-vX.Y.Z or bathy-<region>-vX.Y.Z.
# The tag must equal the pack's version in chartpack/regions/<region>.toml (scripts/check-pack-tag.sh).
#
# No local builds: every pack builds here, on ubuntu-24.04, through chartpack/scripts/fit-guard.sh
# (max RSS 12 GiB, free disk 2 GiB, 5 h). A pack that does not fit is split on the ownership grid.
#
# Dry run: start this workflow by hand (workflow_dispatch) with a pack and a region. It builds,
# checks and archives like a tag run, then uploads the archive, SHA256SUMS and build-stats.json as
# a workflow artifact. It skips the tag check and never publishes.

on:
  push:
    tags: ['charts-*', 'bathy-*']
  workflow_dispatch:
    inputs:
      pack:
        description: Pack kind
        type: choice
        options: [charts, bathy]
        required: true
      region:
        description: Region file name without .toml
        type: string
        required: true

permissions:
  contents: read

env:
  TIPPECANOE_TAG: "2.79.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      pack: ${{ steps.tag.outputs.pack }}
      region: ${{ steps.tag.outputs.region }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the region file
        id: tag
        env:
          INPUT_PACK: ${{ inputs.pack }}
          INPUT_REGION: ${{ inputs.region }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Dry run: no tag, so take the version from the region file.
            file="chartpack/regions/${INPUT_REGION}.toml"
            ver="$(sed -n -E "s/^[[:space:]]*${INPUT_PACK}_version[[:space:]]*=[[:space:]]*\"([0-9]+\.[0-9]+\.[0-9]+)\".*$/\1/p" "$file" | head -n1)"
            if [ -z "$ver" ]; then
              echo "no ${INPUT_PACK}_version in $file" >&2
              exit 1
            fi
            line="PACK=${INPUT_PACK} REGION=${INPUT_REGION} VERSION=${ver}"
          else
            line="$(chartpack/scripts/check-pack-tag.sh "${GITHUB_REF_NAME}")"
          fi
          echo "$line"
          # "PACK=charts REGION=x VERSION=1.0.0" becomes the outputs pack, region and version.
          echo "$line" | tr ' ' '\n' | sed -E 's/^PACK=/pack=/; s/^REGION=/region=/; s/^VERSION=/version=/' >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    env:
      CM_WORK: ${{ github.workspace }}/chartpack/work
      PACK: ${{ needs.version.outputs.pack }}
      REGION: ${{ needs.version.outputs.region }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal g++ make zlib1g-dev libsqlite3-dev time

      - name: Cache tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/tippecanoe
            ~/.local/bin/tile-join
          key: tippecanoe-${{ env.TIPPECANOE_TAG }}-ubuntu-24.04

      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: chartpack/scripts/install-tippecanoe.sh

      - name: Create venv and install
        working-directory: chartpack
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e .

      - name: Fetch and build the charts pack
        if: env.PACK == 'charts'
        working-directory: chartpack
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/chartpack fetch-enc "regions/${REGION}.toml" --cache cache
          .venv/bin/chartpack fetch-seabed "regions/${REGION}.toml" --cache cache
          mkdir -p work
          scripts/fit-guard.sh "${GITHUB_WORKSPACE}/build-stats.json" -- \
            .venv/bin/chartpack build-enc "regions/${REGION}.toml" work/charts --cache cache --work work/enc

      - name: Fetch and build the bathy pack
        if: env.PACK == 'bathy'
        working-directory: chartpack
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/chartpack fetch-enc "regions/${REGION}.toml" --cache cache
          .venv/bin/chartpack fetch-bathy "regions/${REGION}.toml" --cache cache
          mkdir -p work
          scripts/fit-guard.sh "${GITHUB_WORKSPACE}/build-stats.json" -- \
            .venv/bin/chartpack build-bathy "regions/${REGION}.toml" work/bathy --cache cache --work work/bathy-tmp

      - name: Check the pack
        working-directory: chartpack
        run: |
          .venv/bin/chartpack check "work/${PACK}/${PACK}-${REGION}-${VERSION}" --enc-cache cache

      - name: Archive the pack
        working-directory: chartpack
        run: |
          .venv/bin/chartpack archive "work/${PACK}/${PACK}-${REGION}-${VERSION}" dist
          cp "${GITHUB_WORKSPACE}/build-stats.json" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pack
          path: |
            chartpack/dist/${{ needs.version.outputs.pack }}-${{ needs.version.outputs.region }}-${{ needs.version.outputs.version }}.tar
            chartpack/dist/SHA256SUMS
            chartpack/dist/build-stats.json
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar
            SHA256SUMS
            build-stats.json
          generate_release_notes: true
          # "Latest" stays with the n2kd v* releases; a pack release never replaces it.
          make_latest: false
