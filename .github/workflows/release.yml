name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches CMake version
        run: scripts/check-version-tag.sh "${GITHUB_REF_NAME}"
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Configure tested x86_64 build
        run: cmake -S . -B build-test -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build tested x86_64 build
        run: cmake --build build-test
      - name: Set up vcan0
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - name: Test
        run: ctest --test-dir build-test --output-on-failure
      - name: Configure x86_64 release
        run: cmake -S . -B build-x86_64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DN2K_BUILD_TESTS=OFF
      - name: Build x86_64 release
        run: cmake --build build-x86_64 --target n2kd
      - name: Configure aarch64 release
        run: >
          cmake -S . -B build-aarch64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DN2K_BUILD_TESTS=OFF
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
      - name: Build aarch64 release
        run: cmake --build build-aarch64 --target n2kd
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/package-n2kd.sh build-x86_64 "${VERSION}" x86_64
          scripts/package-n2kd.sh build-aarch64 "${VERSION}" aarch64
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: n2kd-*.tar.gz
          generate_release_notes: true
