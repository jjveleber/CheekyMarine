# Victoria, Gulf Islands, Boundary Pass, Vancouver, Burrard Inlet, Indian Arm, Fraser River, Howe Sound (plan 8 spec
# 4). Charts are derived from NONNA and the BC Freshwater Atlas inside the Canada polygon.
name = "bc-south-georgia"
charts_version = "1.0.0"
bathy_version = "1.0.0"
bbox = [-123.95, 48.3, -122.2, 49.6]

[charts]
kind = "derived-inshore"

# Every Active cell of bands 1 to 3 whose catalog polygon meets the owned tiles (zoom-10 tiles, grid.toml), from
# `chartpack cells` and the catalog of 2026-11-12. Their features are cut at the Canada polygon.
[enc]
band1 = ["US1GLBDD"]
band3 = ["US3WA1EE", "US3WA1EF"]

[bathy]
sources = ["nonna10", "nonna100", "crm", "etopo"]
dem_maxzoom = 14

[datum]
file = "datum/wa-stations.toml"  # CRM south of 49 N; NONNA is on chart datum and ETOPO takes a fixed shift

[[render.views]]
name = "vancouver-indian-arm"  # Vancouver harbor and Indian Arm
lon = -122.95
lat = 49.31
zooms = [9, 11, 13, 15]
