# Princess Royal Island, lower Douglas Channel and most of Grenville Channel, from the zoom-10 row
# edge at 53.120405283106564 N to the one at 53.9560855309879 N (plan 8 spec 4). bc-north-north is split in two at
# 53.9560855309879 N for the fit guard (plan 8 Task 16 Step 2). Charts are derived from NONNA and the BC Freshwater
# Atlas inside the Canada polygon.
name = "bc-north-mid"
charts_version = "1.0.0"
bathy_version = "1.0.0"
bbox = [-131.2, 53.120405283106564, -127.8, 53.9560855309879]

[charts]
kind = "derived-inshore"

# Every Active cell of bands 1 to 3 whose catalog polygon meets the owned tiles (zoom-10 tiles, grid.toml), from
# `chartpack cells` and the catalog of 2026-11-12. Their features are cut at the Canada polygon.
[enc]
band1 = ["US1GLBDD"]

[bathy]
sources = ["nonna10", "nonna100", "etopo"]
dem_maxzoom = 14

[datum]
file = "datum/wa-stations.toml"  # CRM south of 49 N; NONNA is on chart datum and ETOPO takes a fixed shift
