# Every Active cell of bands 3 to 5 whose catalog polygon meets the bbox (`chartpack cells`, catalog of
# 2026-10-29). Bands 1 and 2 (US1GLBDD, US2PACWY) also meet it but are left out: band 3 covers the whole
# bbox, so the quilt would clip band 2 away everywhere, and band 1 has no zoom range.
