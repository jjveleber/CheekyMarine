# Canadian side of the Strait, Port Renfrew, Barkley Sound, Clayoquot Sound (plan 8 spec 4). Charts are derived from
# NONNA and the BC Freshwater Atlas inside the Canada polygon.
name = "bc-vi-west-south"
charts_version = "1.0.0"
bathy_version = "1.0.0"
bbox = [-126.6, 48.25, -123.95, 49.5]

[charts]
kind = "derived-inshore"

# Every Active cell of bands 1 to 3 whose catalog polygon meets the owned tiles (zoom-10 tiles, grid.toml), from
# `chartpack cells` and the catalog of 2026-11-12. Their features are cut at the Canada polygon.
[enc]
band1 = ["US1GLBDD"]
band3 = ["US3WA1ED", "US3WA1EE"]

[bathy]
sources = ["nonna10", "nonna100", "crm", "etopo"]
dem_maxzoom = 14

[datum]
file = "datum/wa-stations.toml"  # CRM south of 49 N; NONNA is on chart datum and ETOPO takes a fixed shift

[[render.views]]
name = "barkley-sound"
lon = -125.25
lat = 48.90
zooms = [9, 11, 13, 15]

[[render.views]]
name = "tofino-shelf"  # a NONNA hole on the shelf
lon = -126.10
lat = 49.05
zooms = [9, 11, 13, 15]

[[render.views]]
name = "crm-edge-49n"  # the 49 N line where CRM ends
lon = -126.0
lat = 49.0
zooms = [9, 11, 13, 15]
