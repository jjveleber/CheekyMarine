# The overview pack (spec 5.2): zoom 9 and below over all wave 1 regions, from bands 1 to 3 and one CRM read.
name = "overview"
charts_version = "1.0.0"
bathy_version = "1.0.0"
bbox = [-127.0, 46.15, -122.1, 49.05]
overview = true
clip = "clip/canada-wa.geojson"

# Every Active cell of bands 1 to 3 whose catalog polygon meets all wave 1 owned tiles (zoom-10 tiles,
# grid.toml), from `chartpack cells` and the catalog of 2026-11-09.
[enc]
band1 = ["US1GLBDD"]
band2 = ["US2PACWX", "US2PACWY"]
band3 = [
    "US3WA1CD", "US3WA1CE", "US3WA1DD", "US3WA1DE", "US3WA1DF", "US3WA1DG", "US3WA1ED", "US3WA1EE", "US3WA1EF",
    "US3WA1EG",
]

[bathy]
sources = ["crm"]  # one CRM read over the bbox (load_region)
dem_maxzoom = 14

[datum]
file = "datum/wa-stations.toml"

[[render.views]]
name = "strait-and-coast"  # the Strait and the WA coast, at overview zooms
lon = -124.6
lat = 47.8
zooms = [7, 9]
