# Off Haida Gwaii and Queen Charlotte Sound to about 100 mi (plan 8 spec 4). Coarse depth only: NONNA-100, then the
# worldwide grids. Its area is the polygon of the spec's appendix; the inshore packs come first in grid.toml, so a
# tile shared with an inshore box is theirs.
name = "bc-offshore-north"
charts_version = "1.0.0"
bathy_version = "1.0.0"
bbox = [-135.592, 51.0, -129.2, 55.0]  # the bounds of area.polygon

[charts]
kind = "derived-offshore"

[area]
