# Every Active cell of bands 1 to 5 whose catalog polygon meets the owned tiles (zoom-10 tiles, grid.toml), from
# `chartpack cells` and the catalog of 2026-11-12. Their features are cut at the Canada polygon; bands 4 and 5 keep
# NOAA's finest detail in the Alaskan water of the owned tiles.
[enc]
band1 = ["US1GLBDC", "US1GLBDD"]
band2 = ["US2PACYU", "US2PACYW"]
band3 = ["US3AK1DW", "US3AK1DX", "US3AK1DY"]
band4 = [
    "US4AK5FL", "US4AK5FN", "US4AK5FO", "US4AK5FZ", "US4AK5GL", "US4AK5GN", "US4AK5GO", "US4AK5GP", "US4AK5GQ",
    "US4AK5GZ",
]
band5 = ["US5KTNCE", "US5KTNDE", "US5KTNED", "US5KTNEE", "US5KTNFC", "US5KTNFD", "US5KTNFE"]

[bathy]
sources = ["nonna100", "etopo"]
dem_maxzoom = 14

[datum]
file = "datum/wa-stations.toml"  # CRM south of 49 N; NONNA is on chart datum and ETOPO takes a fixed shift

[[render.views]]
name = "offshore-north"
lon = -134.0
lat = 53.0
zooms = [7, 9, 11]
