# NAVD88 to MLLW offsets at NOAA CO-OPS tide stations, for the bathy datum of every Washington region
# (plan 7, #88). Each station's navd88_to_mllw_m is how far NAVD88 zero lies above MLLW: NAVD88 minus MLLW,
# both relative to the station datum (navd88_m and mllw_m, meters), from the CO-OPS datums API at `source`.
# All are on the 1983-2001 National Tidal Datum Epoch. The build interpolates between the stations
# (inverse distance weighting, chartpack.datum.offsets).
#
# Station list (2026-11-09): the plan's list, confirmed against the API. Port Townsend 9444900 and
# Friday Harbor 9449880 publish MLLW but no NAVD88, so NAS Whidbey Island 9447973 stands in for both.
# Everett 9447659 is added. See each station's note.

[[stations]]
id = "9447130"
name = "Seattle"
lat = 47.60264
lon = -122.3393
navd88_m = 3.134
mllw_m = 2.419
navd88_to_mllw_m = 0.715
epoch = "1983-2001"
source = "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/9447130/datums.json?units=metric"
retrieved = 2026-11-09

