<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chartpack render</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>html, body, #map { margin: 0; width: 100%; height: 100%; }</style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as maplibregl from "/vendor/maplibre-gl.mjs";
const q = new URLSearchParams(location.search);
const map = new maplibregl.Map({
  container: "map",
  style: q.get("style"),
  center: [parseFloat(q.get("lon")), parseFloat(q.get("lat"))],
  zoom: parseFloat(q.get("zoom")),
  attributionControl: false,
  fadeDuration: 0,
});
map.on("error", (e) => { (window.__errors = window.__errors || []).push(String(e.error && e.error.message || e)); });
map.on("idle", () => { window.__rendered = true; });
</script>
</body>
</html>
